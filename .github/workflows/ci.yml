name: CI

# Ejecuta en cada commit (push a cualquier rama) y en cada PR.
on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ce9b86149ffd8ec6e544e # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1a34d9d7d1d43142c2 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # No construye si lint/test fallan.
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ce9b86149ffd8ec6e544e # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1a34d9d7d1d43142c2 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # El endpoint crea Resend dentro del handler, así que el build no
        # requiere la API key real; usamos un placeholder por claridad.
        env:
          RESEND_API_KEY: re_placeholder_ci
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    # Solo en push a main y si build pasó.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ce9b86149ffd8ec6e544e # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1a34d9d7d1d43142c2 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Vercel
        uses: amondnet/vercel-action@08b2e9ecb28fffa4d4b777c8a42e49c29e58b3b1 # v25
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          # Production deployment solo en push a main.
          vercel-args: '--prod'
