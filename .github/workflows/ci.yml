name: CI

# Ejecuta en cada commit (push a cualquier rama) y en cada PR.
on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # No construye si lint/test fallan.
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # El endpoint crea Resend dentro del handler. En runtime usa la API
        # key real; en el build la necesitamos para que el chequeo de tipos
        # no falle. Usa el secret si existe, si no un placeholder de claridad.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder_ci' }}
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    # Solo en push a main y si build pasó.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Link automatico: infiere el proyecto y el team desde el git remote
      # (github.com/marcelortz/fenix-construcciones) y el VERCEL_TOKEN.
      # El deploy usa el .vercel generado, sin necesidad de ORG_ID/PROJECT_ID.
      - name: Link & Deploy to Vercel (production)
        run: npx vercel@latest link --yes && npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes

  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    # Solo en PRs y si build pasó.
    needs: build
    if: github.event_name == 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Link & Deploy Preview to Vercel
        id: preview
        run: npx vercel@latest link --yes && echo "preview-url=$(npx vercel@latest deploy --token "$VERCEL_TOKEN" --yes)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.preview-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Preview desplegado: ${url}`,
            });
