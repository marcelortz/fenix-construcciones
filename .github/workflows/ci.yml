name: CI

# Ejecuta en cada commit (push a cualquier rama) y en cada PR.
on:
  push:
  pull_request:

jobs:
  lint-test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  build:
    name: Build
    runs-on: ubuntu-latest
    # No construye si lint/test fallan.
    needs: lint-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        # El endpoint crea Resend dentro del handler. En runtime usa la API
        # key real; en el build la necesitamos para que el chequeo de tipos
        # no falle. Usa el secret si existe, si no un placeholder de claridad.
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY || 're_placeholder_ci' }}
        run: npm run build

  deploy-vercel:
    name: Deploy to Vercel (production)
    runs-on: ubuntu-latest
    # Solo en push a main y si build pasó.
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_ZTzg4DipCJQwVC36sd86WFIV' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_EX8B8DizVCenUhAj9On2VPr5uw2Q' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Inspect Vercel Account & Scope
        run: |
          echo "=== Vercel User ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/user | jq '{username: .user.username, email: .user.email, id: .user.id}' || true
          echo "=== Vercel Teams ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v2/teams | jq '.teams[]? | {id: .id, slug: .slug, name: .name}' || true
          echo "=== Vercel Projects ==="
          curl -s -H "Authorization: Bearer $VERCEL_TOKEN" https://api.vercel.com/v9/projects | jq '.projects[]? | {id: .id, name: .name, accountId: .accountId}' || true

      - name: Deploy to Vercel (production)
        run: npx vercel@latest deploy --prod --token "$VERCEL_TOKEN" --yes --scope "${VERCEL_SCOPE:-marcelortzs-projects}" --debug

  deploy-preview:
    name: Deploy Preview to Vercel
    runs-on: ubuntu-latest
    # Solo en PRs y si build pasó.
    needs: build
    if: github.event_name == 'pull_request'
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID || 'team_ZTzg4DipCJQwVC36sd86WFIV' }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID || 'prj_EX8B8DizVCenUhAj9On2VPr5uw2Q' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy Preview to Vercel
        id: preview
        run: echo "preview-url=$(npx vercel@latest deploy --token "$VERCEL_TOKEN" --yes --scope "${VERCEL_SCOPE:-marcelortzs-projects}" --debug)" >> "$GITHUB_OUTPUT"

      - name: Comment preview URL on PR
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.preview.outputs.preview-url }}';
            if (!url) return;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `✅ Preview desplegado: ${url}`,
            });
